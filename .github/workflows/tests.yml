name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        # Scoped to the shared core + tests; the one-off admin scripts have
        # pre-existing style debt that's out of scope for now.
        run: ruff check _master.py authenticator.py text_utils.py tests/

      - name: Run tests
        run: pytest
